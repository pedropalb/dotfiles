symbolPreset: nerd
theme:
  dark: anthracite
  light: light
setupVersion: 2
modelRoles:
  default: opencode-go/muse-spark-1.3-contributor:xhigh
  slow: opencode-go/glm-5.3:max
  smol: opencode-go/muse-spark-1.3-contributor:high
  tiny: opencode-go/muse-spark-1.3-contributor:low
  advisor: opencode-go/kimi-k3:max
  commit: opencode-go/muse-spark-1.3-contributor:medium
skills:
  ignoredSkills:
    - brainstorming
    - dispatching-parallel-agents
    - finishing-a-development-branch
    - subagent-driven-development
    - test-driven-development
    - using-git-worktrees
    - writing-plans
    - writing-skills
    - executing-plans
    - receiving-code-review
    - requesting-code-review
    - systematic-debugging
    - using-superpowers
    - verification-before-completion
compaction:
  thresholdTokens: 300000
  thresholdPercent: -1
disabledProviders:
  - claude-plugins
  - gemini
  - opencode
  - claude
  - codex
tools:
  approvalMode: yolo
memory:
  backend: mnemopi
lsp:
  diagnosticsOnWrite: true
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: false
  compactThinkingLevel: false
  showHookStatus: true
terminal:
  showProgress: false
display:
  showTokenUsage: true
  cacheMissMarker: true
  showTurnTime: true
steeringMode: one-at-a-time
interruptMode: immediate
treeFilterMode: default
shellMinimizer:
  sourceOutlineLevel: default
task:
  maxEffort: high
  maxConcurrency: 4
  maxRecursionDepth: 2
  softRequestBudget: 150
  isolation:
    commits: generic
    enabled: true
  agentModelOverrides: {}
  showResolvedModelBadge: true
tui:
  tight: true
  textSizing: true
textVerbosity: medium
personality: pragmatic
mnemopi:
  scoping: per-project-tagged
  polyphonicRecall: true
  proactiveLinking: true
  enhancedRecall: true
autolearn:
  enabled: true
  autoContinue: false
hideThinkingBlock: false
edit:
  mode: hashline
dev:
  autoqaConsent: granted
disabledExtensions:
  - skill:task-breakdown
defaultThinkingLevel: auto
ttsr:
  contextMode: discard
composer:
  shape: claude
security:
  enabled: true
isolation:
  backend: auto
browser:
  relay: true