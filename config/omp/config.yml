symbolPreset: nerd
theme: 
  dark: anthracite
  light: light
setupVersion: 1
modelRoles: 
  default: openai-codex/gpt-5.6-terra:medium
  slow: openai-codex/gpt-5.6-sol:high
  smol: opencode-go/gpt-5.6-luna:max
  tiny: opencode-go/deepseek-v4-flash:xhigh
